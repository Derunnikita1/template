version: "2"

run:
  concurrency: 8
  timeout: 5m
  build-tags:
    - integration

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gochecknoinits
    - gocritic
    - gocyclo
    - goconst
    - gosec
    - govet
    - ineffassign
    - makezero
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: net/http
              desc: domain cannot depend on transport
            - pkg: github.com/go-chi/chi
              desc: domain cannot depend on router
            - pkg: github.com/jackc/pgx
              desc: domain cannot depend on database driver
            - pkg: github.com/Masterminds/squirrel
              desc: domain cannot build SQL
            - pkg: go.opentelemetry.io/otel
              desc: domain cannot depend on telemetry
        usecase:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: net/http
              desc: usecase cannot depend on transport
            - pkg: github.com/go-chi/chi
              desc: usecase cannot depend on router
            - pkg: github.com/jackc/pgx
              desc: usecase uses interfaces instead of database driver
            - pkg: github.com/Masterminds/squirrel
              desc: usecase cannot build SQL
        transport:
          files:
            - "**/internal/http/**"
          deny:
            - pkg: github.com/Derunnikita1/template/internal/repository
              desc: transport cannot depend on repositories
            - pkg: github.com/Derunnikita1/template/internal/infra
              desc: transport cannot depend on infrastructure
    forbidigo:
      forbid:
        - pattern: ^[A-Za-z0-9]{1,}_.*\.
    revive:
      rules:
        - name: var-naming
          disabled: true
    unparam:
      check-exported: true
    unused:
      field-writes-are-uses: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/generated/

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/generated/
